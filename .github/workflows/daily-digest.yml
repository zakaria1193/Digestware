name: Nightly Digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run the digest pipeline with DEBUG-level logging'
        type: boolean
        default: false
      archive:
        description: 'Archive existing content under .old/ before running'
        type: boolean
        default: false
      purge:
        description: 'Purge existing content before running (no archive kept)'
        type: boolean
        default: false
      lesson_only:
        description: 'Skip ingestion entirely — only write the Lesson of the Week'
        type: boolean
        default: false
      lesson_weeks:
        description: 'How many complete weeks back to write lessons for (1 lesson each, ~EUR 0.40 apiece)'
        type: string
        default: '1'
      since_hours:
        description: 'First lookback window in hours. Raise it to catch up after missed nights; main.py still clamps it to the gap since the newest article on disk'
        type: string
        default: '48'

jobs:
  # ── 1. Quality gate (reused from test.yml) ───────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 2. Digest pipeline ───────────────────────────────────────────────────────
  digest:
    name: Run Digest Pipeline
    needs: test
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      # Needed by the pre-commit site build below.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      # The Lesson of the Week reads the projects' real source trees from bare,
      # blobless clones under agents/cache (~640 MB for gcc). Caching them turns
      # the nightly cost into an incremental `git fetch` instead of a fresh
      # clone. The run_id key always misses so the cache is rewritten each night
      # with the newly-fetched objects; the prefix restore is what actually
      # supplies the previous night's clone.
      - name: Restore source-repo clones
        uses: actions/cache@v4
        with:
          path: agents/cache
          key: lesson-repos-${{ github.run_id }}
          restore-keys: |
            lesson-repos-

      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set in repo settings — the pipeline would silently emit stub digests."
            exit 1
          fi

      # A wrong model slug fails only at request time, after everything before
      # it has been paid for. `/models` is free and unauthenticated, so this
      # turns that whole class of late, confusing failure into an immediate one
      # naming the closest available slugs.
      - name: Check model slugs resolve
        env:
          LESSON_RESEARCH_MODEL: ${{ vars.LESSON_RESEARCH_MODEL }}
          LESSON_WRITER_MODEL: ${{ vars.LESSON_WRITER_MODEL }}
        run: python -m agents.check_models

      # Optional: archive previous output under .old/<UTC-timestamp>/
      # Only runs when explicitly requested via workflow_dispatch with archive=true.
      - name: Archive previous generated content
        if: ${{ inputs.archive && !inputs.purge && !inputs.lesson_only }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          ARCHIVE=".old/${TS}"
          mkdir -p \
            "${ARCHIVE}/content/discussions" \
            "${ARCHIVE}/content/landings" \
            "${ARCHIVE}/content/digests" \
            "${ARCHIVE}/output"
          move_files() {
            local src="$1" dst="$2"
            find "${src}" -type f ! -name '.gitkeep' -exec mv -t "${dst}" {} + 2>/dev/null || true
          }
          move_files web/src/content/discussions "${ARCHIVE}/content/discussions"
          move_files web/src/content/landings    "${ARCHIVE}/content/landings"
          move_files web/src/content/digests     "${ARCHIVE}/content/digests"
          move_files agents/output               "${ARCHIVE}/output"
          find "${ARCHIVE}" -mindepth 1 -type d -empty -delete
          rmdir "${ARCHIVE}" 2>/dev/null || true
          rmdir .old 2>/dev/null || true
          echo "ARCHIVE_PATH=${ARCHIVE}" >> "${GITHUB_ENV}"

      # Manual runs with purge=true delete content outright and bypass dedup
      # via --force so the agent re-ingests from scratch.
      - name: Purge previous generated content
        if: ${{ inputs.purge && !inputs.lesson_only }}
        run: |
          python - <<'PY'
          import pathlib
          roots = [
              pathlib.Path("web/src/content/landings"),
              pathlib.Path("web/src/content/discussions"),
              pathlib.Path("web/src/content/digests"),
          ]
          removed = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for md in root.glob("*.md"):
                  md.unlink()
                  removed += 1
          print(f"Purged {removed} file(s).")
          PY

      - name: Run digest pipeline (48 h window, backfill to min 5 each)
        if: ${{ !inputs.lesson_only }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_ENTRIES: '5'
          DEBUG_FLAG: ${{ inputs.debug && '--debug' || '' }}
          FORCE_FLAG: ${{ inputs.purge && '--force' || '' }}
          FIRST_WINDOW: ${{ inputs.since_hours || '48' }}
        run: |
          set -euo pipefail
          count() { find "$1" -type f -name '*.md' 2>/dev/null | wc -l; }

          for hours in "${FIRST_WINDOW}" 168 720 2160; do
            echo "::group::digest run (--since-hours ${hours})"
            python -m agents.main --since-hours "${hours}" --skip-categorize --skip-lesson ${DEBUG_FLAG} ${FORCE_FLAG}
            echo "::endgroup::"

            d=$(count web/src/content/discussions)
            l=$(count web/src/content/landings)
            echo "After ${hours} h window: discussions=${d}, landings=${l}"

            if [ "${d}" -ge "${MIN_ENTRIES}" ] && [ "${l}" -ge "${MIN_ENTRIES}" ]; then
              echo "Minimum ${MIN_ENTRIES}/${MIN_ENTRIES} satisfied — stopping."
              break
            fi
          done

      - name: Categorize tags
        if: ${{ !inputs.lesson_only }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m agents.tag_categorizer

      # Lesson of the Week — one long-form, source-grounded piece per ISO week,
      # gcc and binutils alternating. Runs once, after the backfill loop,
      # against the final content set. Nightly invocation is fine: the picker
      # no-ops on a week that already has its lesson, so this produces output
      # roughly once a week and is self-healing if a night fails.
      #
      # `lesson_weeks` (manual runs only) backfills older weeks by naming each
      # one explicitly. The per-week guard still applies, so each iteration
      # writes at most one lesson and a week already on disk costs nothing.
      # It defaults to 1 on purpose: the article is written by a premium model,
      # so a dispatch asking for four would spend roughly a third of the
      # month's entire AI budget in one go.
      #
      # `continue-on-error`: a lesson is editorial garnish on the digest. A
      # model outage or a mirror that hasn't caught up must not block the
      # nightly content refresh from being committed.
      - name: Lesson of the Week
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LESSON_RESEARCH_MODEL: ${{ vars.LESSON_RESEARCH_MODEL }}
          LESSON_WRITER_MODEL: ${{ vars.LESSON_WRITER_MODEL }}
          LESSON_WEEKS: ${{ inputs.lesson_weeks || '1' }}
          DEBUG_FLAG: ${{ inputs.debug && '--debug' || '' }}
        run: |
          set -euo pipefail
          # Week keys are derived by the same code the agent uses, so a manual
          # backfill can never disagree with the nightly run about which
          # Monday-to-Sunday it is targeting.
          WEEKS="$(python - <<'PY'
          import datetime, os
          from agents.lesson_picker import previous_complete_week, week_of
          n = max(1, min(12, int(os.environ.get("LESSON_WEEKS", "1") or 1)))
          w = previous_complete_week(datetime.date.today())
          for _ in range(n):
              print(w.key)
              w = week_of(w.start - datetime.timedelta(days=7))
          PY
          )"
          # Tee to a file as well as the log: the job log is dominated by
          # ~4,900 lines of Astro build output, and the GitHub logs API
          # truncates from the FRONT, so the lesson step's own output is
          # effectively unreadable after the fact. The uploaded artifact is
          # the only reliable way to see why a lesson failed.
          for week in ${WEEKS}; do
            echo "::group::lesson ${week}"
            python -m agents.main --lesson-only --lesson-week "${week}" ${DEBUG_FLAG} \
              2>&1 | tee -a lesson-run.log
            echo "::endgroup::"
          done

          # A stub is what the agent writes when research or writing failed.
          # Without this the step goes green having published nothing but
          # "Lesson unavailable" placeholders — which is exactly what happened
          # on the first real run. Surface it as an annotation instead.
          python - <<'PY'
          import pathlib
          from agents.tools.frontmatter import load_frontmatter
          stubs = []
          for md in sorted(pathlib.Path("web/src/content/lessons").glob("*.md")):
              parsed = load_frontmatter(md.read_text(encoding="utf-8"))
              if parsed and parsed[0].get("is_stub"):
                  stubs.append(f"{md.name} ({parsed[0].get('stub_reason')})")
          for s in stubs:
              print(f"::error::Lesson written as a STUB — generation failed: {s}")
          print(f"{len(stubs)} stub lesson(s) on disk.")
          PY

          # A month that runs out of budget produces no lesson, which otherwise
          # looks identical to the feature being broken. Say which it is.
          if grep -q "the month's AI budget is spent" lesson-run.log 2>/dev/null; then
            echo "::warning::No lesson this run — the month's AI budget is spent. Lessons resume on the 1st."
          fi

      # `continue-on-error`: this is a DIAGNOSTIC upload sitting upstream of
      # the validate → build → commit steps, so anything that fails it throws
      # away the whole night's content. That is not hypothetical: runs 196 and
      # 197 both died here on "Artifact storage quota has been hit", and two
      # nights of digests were never committed because a log file could not be
      # stored. Retention is short for the same reason — a lesson log is only
      # ever read in the days after the run that produced it.
      - name: Upload lesson run log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lesson-run
          path: lesson-run.log
          retention-days: 5
          if-no-files-found: ignore

      # Gate: never commit content that would break the Cloudflare Pages build.
      # The pipeline pushes straight to master, so a malformed frontmatter block
      # takes the public site down until someone notices the failed deploy.
      - name: Validate generated content
        run: |
          python -m agents.tools.validate_content

      - name: Build site (same check Cloudflare Pages runs)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit generated content
        env:
          LESSON_ONLY: ${{ inputs.lesson_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # usage.log is the spend ledger the monthly budget guard reads.
          # A fresh runner has an empty working tree, so if this is not
          # committed every run computes a month-to-date spend of zero and
          # the cap never binds. See agents/budget.py.
          git add web/src/content/ web/src/data/tag-categories/
          # Tolerate a missing ledger. `append_usage()` only writes on a
          # SUCCESSFUL model call, so a run whose every call failed creates no
          # file at all — and `git add` on a non-existent path is a fatal
          # error that kills the commit step. That is exactly what happened on
          # run 191: the lesson diagnostics were never committed because the
          # ledger recording their failure did not exist.
          [ -f agents/output/usage.log ] && git add agents/output/usage.log || true
          [ -d .old ] && git add -f .old/ || true
          MSG="chore(digest): nightly refresh $(date -u +%Y-%m-%d)"
          if [ "${LESSON_ONLY}" = "true" ]; then
            MSG="chore(lessons): manual lesson run $(date -u +%Y-%m-%d)"
          fi
          # Spelled out rather than chained. `A && B || C && D` is
          # left-associative, so the old one-liner ran `git push` even on the
          # "no content change" path — normally a harmless "Everything
          # up-to-date", but a hard failure whenever the branch has moved
          # since checkout, which fails a job that had nothing to commit.
          if git diff --cached --quiet; then
            echo "No content change."
          else
            git commit -m "${MSG}"
            git push
          fi

      # ── Pulse search index ────────────────────────────────────────────────
      # Derived from the Markdown just committed, so it runs last. The .db is
      # never committed (it is regenerable and would make every nightly diff
      # binary) — it ships as a workflow artifact instead, which is what lets
      # someone run the MCP server without re-embedding the corpus themselves.
      #
      # The cache is what makes the build incremental. Without a restored .db
      # every run starts from an empty database and re-embeds the whole corpus,
      # which costs real money and grows linearly as the archive does. The
      # content-hash check in agents/index/build.py can only skip work when
      # there is a prior database to compare against.
      - name: Restore Pulse index cache
        uses: actions/cache@v4
        with:
          path: agents/index/pulse.db
          # A unique key never hits, so this always saves a fresh entry; the
          # restore-key prefix then supplies the most recent previous one.
          key: pulse-db-${{ github.run_id }}
          restore-keys: |
            pulse-db-

      - name: Build Pulse index
        env:
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
        run: |
          set -euo pipefail
          # No --full: the build re-indexes only files whose content hash
          # changed, drops rows for deleted ones, and re-embeds only what it
          # re-indexed. A stale or absent cache is safe — it just means more
          # work, not wrong output.
          #
          # Without a key the index is still fully usable for lexical and
          # symbol search — only the semantic recall channel is absent — so a
          # missing secret degrades the index rather than failing the night.
          if [ -z "${EMBEDDING_API_KEY:-}" ]; then
            echo "::notice::EMBEDDING_API_KEY not set — building a lexical-only index."
            python -m agents.index.build --no-embeddings
          else
            python -m agents.index.build
          fi

      # `continue-on-error` for the same reason as the lesson log: the .db is
      # derived and regenerable, so failing the night over it is never right.
      # It is also the biggest thing this workflow stores — a nightly upload of
      # the whole corpus index is what exhausts the account's artifact quota —
      # hence the short retention. Anyone who needs an older one rebuilds it
      # with `python -m agents.index.build --full`.
      - name: Upload Pulse index artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pulse-index
          path: agents/index/pulse.db
          retention-days: 3
          if-no-files-found: error

      # LAST on purpose. The GitHub logs API returns only the TAIL of a job
      # log, and the Astro build in the middle of this job emits ~4,900 lines —
      # so anything printed by the lesson step is unreachable after the fact.
      # Repeating the diagnosis here, at the end, makes it always readable
      # without downloading the artifact. `always()` because a failed run is
      # precisely when this matters.
      - name: Lesson diagnostics
        if: always()
        run: |
          echo "===== LESSON DIAGNOSTICS ====="
          python - <<'PY'
          import pathlib
          from agents.tools.frontmatter import load_frontmatter
          lessons = sorted(pathlib.Path("web/src/content/lessons").glob("*.md"))
          if not lessons:
              print("No lesson files on disk.")
          for md in lessons:
              parsed = load_frontmatter(md.read_text(encoding="utf-8"))
              fm = parsed[0] if parsed else {}
              state = "STUB" if fm.get("is_stub") else "ok"
              print(f"[{state:>4}] {md.name}")
              if fm.get("is_stub"):
                  print(f"        reason: {fm.get('stub_reason')}")
              else:
                  print(f"        code_tour entries: {len(fm.get('code_tour') or [])}")
          PY
          echo
          echo "----- errors and warnings from the lesson run -----"
          # `agents.writer` matters as much as `agents.lesson_agent`: the body
          # sanitiser logs *there* when it discards an article, and because it
          # was missing from this pattern a complete lesson was replaced by
          # "Summary unavailable" with nothing in the diagnostics to say why.
          grep -E "ERROR|WARNING|Traceback|lesson_agent|agents.writer|Budget check|budget is spent" \
            lesson-run.log 2>/dev/null | tail -40 || echo "(no lesson-run.log)"

  # ── 3. Cache pruning ─────────────────────────────────────────────────────────
  # The source-repo clones and the Pulse index use a unique key per run, so each
  # night adds a full copy (about 2 GB for the clones) and only the newest is
  # ever restored. Left alone they fill the repo's 10 GB allowance, and GitHub
  # then evicts by age, which can include the pip and npm caches. Keeping two
  # means a bad night still leaves the one before it. This is its own job so the
  # pipeline's token never holds `actions: write`, and it runs after `digest` so
  # tonight's entries already exist. A failure here must not fail the night.
  prune-caches:
    name: Prune old caches
    needs: digest
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Keep the two newest of each rolling cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for prefix in lesson-repos- pulse-db-; do
            gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
              xargs -r -n1 gh cache delete
          done
