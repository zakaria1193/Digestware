name: Nightly Digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run the digest pipeline with DEBUG-level logging'
        type: boolean
        default: false
      archive:
        description: 'Archive existing content under .old/ before running'
        type: boolean
        default: false
      purge:
        description: 'Purge existing content before running (no archive kept)'
        type: boolean
        default: false

jobs:
  # ── 1. Quality gate (reused from test.yml) ───────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 2. Digest pipeline ───────────────────────────────────────────────────────
  digest:
    name: Run Digest Pipeline
    needs: test
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      # Needed by the pre-commit site build below.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set in repo settings — the pipeline would silently emit stub digests."
            exit 1
          fi

      # Optional: archive previous output under .old/<UTC-timestamp>/
      # Only runs when explicitly requested via workflow_dispatch with archive=true.
      - name: Archive previous generated content
        if: ${{ inputs.archive && !inputs.purge }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          ARCHIVE=".old/${TS}"
          mkdir -p \
            "${ARCHIVE}/content/discussions" \
            "${ARCHIVE}/content/landings" \
            "${ARCHIVE}/content/digests" \
            "${ARCHIVE}/output"
          move_files() {
            local src="$1" dst="$2"
            find "${src}" -type f ! -name '.gitkeep' -exec mv -t "${dst}" {} + 2>/dev/null || true
          }
          move_files web/src/content/discussions "${ARCHIVE}/content/discussions"
          move_files web/src/content/landings    "${ARCHIVE}/content/landings"
          move_files web/src/content/digests     "${ARCHIVE}/content/digests"
          move_files agents/output               "${ARCHIVE}/output"
          find "${ARCHIVE}" -mindepth 1 -type d -empty -delete
          rmdir "${ARCHIVE}" 2>/dev/null || true
          rmdir .old 2>/dev/null || true
          echo "ARCHIVE_PATH=${ARCHIVE}" >> "${GITHUB_ENV}"

      # Manual runs with purge=true delete content outright and bypass dedup
      # via --force so the agent re-ingests from scratch.
      - name: Purge previous generated content
        if: ${{ inputs.purge }}
        run: |
          python - <<'PY'
          import pathlib
          roots = [
              pathlib.Path("web/src/content/landings"),
              pathlib.Path("web/src/content/discussions"),
              pathlib.Path("web/src/content/digests"),
          ]
          removed = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for md in root.glob("*.md"):
                  md.unlink()
                  removed += 1
          print(f"Purged {removed} file(s).")
          PY

      - name: Run digest pipeline (48 h window, backfill to min 5 each)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_ENTRIES: '5'
          DEBUG_FLAG: ${{ inputs.debug && '--debug' || '' }}
          FORCE_FLAG: ${{ inputs.purge && '--force' || '' }}
        run: |
          set -euo pipefail
          count() { find "$1" -type f -name '*.md' 2>/dev/null | wc -l; }

          for hours in 48 168 720 2160; do
            echo "::group::digest run (--since-hours ${hours})"
            python -m agents.main --since-hours "${hours}" --skip-categorize ${DEBUG_FLAG} ${FORCE_FLAG}
            echo "::endgroup::"

            d=$(count web/src/content/discussions)
            l=$(count web/src/content/landings)
            echo "After ${hours} h window: discussions=${d}, landings=${l}"

            if [ "${d}" -ge "${MIN_ENTRIES}" ] && [ "${l}" -ge "${MIN_ENTRIES}" ]; then
              echo "Minimum ${MIN_ENTRIES}/${MIN_ENTRIES} satisfied — stopping."
              break
            fi
          done

      - name: Categorize tags
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m agents.tag_categorizer

      # Gate: never commit content that would break the Cloudflare Pages build.
      # The pipeline pushes straight to master, so a malformed frontmatter block
      # takes the public site down until someone notices the failed deploy.
      - name: Validate generated content
        run: |
          python -m agents.tools.validate_content

      - name: Build site (same check Cloudflare Pages runs)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/content/ web/src/data/tag-categories/
          [ -d .old ] && git add -f .old/ || true
          git diff --cached --quiet && echo "No content change." || \
            git commit -m "chore(digest): nightly refresh $(date -u +%Y-%m-%d)" && git push

      # ── Pulse search index ────────────────────────────────────────────────
      # Derived from the Markdown just committed, so it runs last. The .db is
      # never committed (it is regenerable and would make every nightly diff
      # binary) — it ships as a workflow artifact instead, which is what lets
      # someone run the MCP server without re-embedding the corpus themselves.
      #
      # The cache is what makes the build incremental. Without a restored .db
      # every run starts from an empty database and re-embeds the whole corpus,
      # which costs real money and grows linearly as the archive does. The
      # content-hash check in agents/index/build.py can only skip work when
      # there is a prior database to compare against.
      - name: Restore Pulse index cache
        uses: actions/cache@v4
        with:
          path: agents/index/pulse.db
          # A unique key never hits, so this always saves a fresh entry; the
          # restore-key prefix then supplies the most recent previous one.
          key: pulse-db-${{ github.run_id }}
          restore-keys: |
            pulse-db-

      - name: Build Pulse index
        env:
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_BASE_URL: ${{ vars.EMBEDDING_BASE_URL }}
        run: |
          set -euo pipefail
          # No --full: the build re-indexes only files whose content hash
          # changed, drops rows for deleted ones, and re-embeds only what it
          # re-indexed. A stale or absent cache is safe — it just means more
          # work, not wrong output.
          #
          # Without a key the index is still fully usable for lexical and
          # symbol search — only the semantic recall channel is absent — so a
          # missing secret degrades the index rather than failing the night.
          if [ -z "${EMBEDDING_API_KEY:-}" ]; then
            echo "::notice::EMBEDDING_API_KEY not set — building a lexical-only index."
            python -m agents.index.build --no-embeddings
          else
            python -m agents.index.build
          fi

      - name: Upload Pulse index artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-index
          path: agents/index/pulse.db
          retention-days: 14
          if-no-files-found: error
