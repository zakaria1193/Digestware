name: Nightly Digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run the digest pipeline with DEBUG-level logging'
        type: boolean
        default: false

jobs:
  # ── 1. Quality gate (reused from test.yml) ───────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 2. Digest pipeline ───────────────────────────────────────────────────────
  digest:
    name: Run Digest Pipeline
    needs: test
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set in repo settings — the pipeline would silently emit stub digests."
            exit 1
          fi

      # Temporary policy while the agent logic is still being stabilised:
      # every nightly run starts from a clean slate, then pulls the last 48 h,
      # expanding the window as needed until at least 5 discussions AND 5
      # landings have been produced.
      #
      # The previous run's output is archived under ``.old/<UTC-timestamp>/``
      # rather than deleted, so usage.log and the superseded Markdown files
      # remain available for debugging while the live content folders still
      # show only the latest run (which Astro reads from).
      - name: Archive previous generated content
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          ARCHIVE=".old/${TS}"
          mkdir -p \
            "${ARCHIVE}/content/discussions" \
            "${ARCHIVE}/content/landings" \
            "${ARCHIVE}/content/digests" \
            "${ARCHIVE}/output"
          move_files() {
            local src="$1" dst="$2"
            # Move every file except .gitkeep; suppress "no files matched" noise.
            find "${src}" -type f ! -name '.gitkeep' -exec mv -t "${dst}" {} + 2>/dev/null || true
          }
          move_files web/src/content/discussions "${ARCHIVE}/content/discussions"
          move_files web/src/content/landings    "${ARCHIVE}/content/landings"
          move_files web/src/content/digests     "${ARCHIVE}/content/digests"
          move_files agents/output               "${ARCHIVE}/output"
          # Drop empty archive subdirs so a run with nothing to archive doesn't
          # leave behind a pile of empty dated folders.
          find "${ARCHIVE}" -mindepth 1 -type d -empty -delete
          rmdir "${ARCHIVE}" 2>/dev/null || true
          rmdir .old 2>/dev/null || true
          echo "ARCHIVE_PATH=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Run digest pipeline (48 h window, backfill to min 5 each)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_ENTRIES: '5'
          DEBUG_FLAG: ${{ inputs.debug && '--debug' || '' }}
        run: |
          set -euo pipefail
          count() { find "$1" -type f -name '*.md' 2>/dev/null | wc -l; }

          # Windows to try in order. Start at 48 h; widen only if we're short.
          # Dedup via build_seen_index() means each extra pass only processes
          # items older than what we already wrote.
          for hours in 48 168 720 2160; do
            echo "::group::digest run (--since-hours ${hours})"
            python -m agents.main --since-hours "${hours}" ${DEBUG_FLAG}
            echo "::endgroup::"

            d=$(count web/src/content/discussions)
            l=$(count web/src/content/landings)
            echo "After ${hours} h window: discussions=${d}, landings=${l}"

            if [ "${d}" -ge "${MIN_ENTRIES}" ] && [ "${l}" -ge "${MIN_ENTRIES}" ]; then
              echo "Minimum ${MIN_ENTRIES}/${MIN_ENTRIES} satisfied — stopping."
              break
            fi
          done

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/content/
          # -f because agents/output/usage.log is gitignored at the original
          # path but we want the archived copy under .old/ committed for
          # debugging history.
          [ -d .old ] && git add -f .old/ || true
          git diff --cached --quiet && echo "No content change." || \
            git commit -m "chore(digest): nightly purge+refresh $(date -u +%Y-%m-%d)" && git push
