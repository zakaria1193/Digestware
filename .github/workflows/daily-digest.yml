name: Nightly Digest

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  # ── 1. Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt pytest ruff pyright

      - name: Lint (ruff)
        run: ruff check agents/

      - name: Type check (pyright)
        run: pyright agents/

      - name: Unit tests
        run: pytest agents/tests -q

  # ── 2. Digest pipeline ───────────────────────────────────────────────────────
  digest:
    name: Run Digest Pipeline
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run digest pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agents.main --since-hours 24

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/content/
          git diff --cached --quiet && echo "No new content." || \
            git commit -m "chore(digest): nightly $(date -u +%Y-%m-%d)" && git push
