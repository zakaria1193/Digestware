name: Nightly Digest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:

jobs:
  # ── 1. Quality gate (reused from test.yml) ───────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 2. Digest pipeline ───────────────────────────────────────────────────────
  digest:
    name: Run Digest Pipeline
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set in repo settings — the pipeline would silently emit stub digests."
            exit 1
          fi

      - name: Run digest pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agents.main --since-hours 24

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/content/
          git diff --cached --quiet && echo "No new content." || \
            git commit -m "chore(digest): nightly $(date -u +%Y-%m-%d)" && git push
