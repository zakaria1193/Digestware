name: Tests & Lint

on:
  workflow_call:   # reusable — call from other workflows via `uses:`

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv venv --clear
          uv pip install -r agents/requirements.txt pytest ruff pyright
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check agents/

      - name: Type check (pyright)
        run: pyright agents/

      - name: Unit tests
        run: pytest agents/tests -q

      - name: Validate content frontmatter
        run: python -m agents.tools.validate_content

  # Builds the site exactly as Cloudflare Pages does, so content that violates
  # the Astro collection schema fails here instead of on the live deploy.
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build
