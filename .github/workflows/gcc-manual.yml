name: GCC Manual (limited)

# Manual iteration workflow for the GCC pipeline:
#   1. Purge existing GCC digests (landings + discussions).
#   2. Re-ingest the last 24 h of GCC activity, capped at N landings and N
#      discussions. GCC is active enough that 24 h reliably yields enough
#      items; caps keep token spend bounded. Fewer than N is fine — we take
#      whatever's there.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      max_landings:
        description: 'Max landings to digest'
        required: true
        default: '5'
      max_discussions:
        description: 'Max discussions to digest'
        required: true
        default: '5'
      since_hours:
        description: 'Lookback window in hours'
        required: true
        default: '24'

jobs:
  gcc-manual:
    name: Purge + refresh GCC (capped)
    runs-on: ubuntu-latest
    environment: alpha
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Check required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set — refusing to run."
            exit 1
          fi

      - name: Purge GCC-only content
        run: |
          python - <<'PY'
          import pathlib, sys
          roots = [
              pathlib.Path("web/src/content/landings"),
              pathlib.Path("web/src/content/discussions"),
          ]
          removed = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for md in root.glob("*.md"):
                  head = md.read_text(errors="replace").split("---", 2)
                  fm = head[1] if len(head) >= 3 else ""
                  # match 'project: gcc' on its own frontmatter line
                  if any(
                      line.strip() in ("project: gcc", 'project: "gcc"', "project: 'gcc'")
                      for line in fm.splitlines()
                  ):
                      md.unlink()
                      removed += 1
          print(f"Purged {removed} GCC file(s).")
          PY

      - name: Run digest pipeline (GCC, capped)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m agents.main \
            --since-hours "${{ inputs.since_hours }}" \
            --project gcc \
            --max-landings "${{ inputs.max_landings }}" \
            --max-discussions "${{ inputs.max_discussions }}" \
            --force

      - name: Commit refreshed GCC content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/content/landings/ web/src/content/discussions/
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore(gcc): manual refresh — ${{ inputs.max_landings }} landings, ${{ inputs.max_discussions }} discussions" && \
            git push
