sources:
  - type: github
    project: gcc
    owner: gcc-mirror
    repo: gcc

  - type: public_inbox
    discussion_lists: [gcc, binutils]
    cvs_lists: [gcc-cvs, binutils-cvs]
    use_nntp: true
    # Per-list project override — each mailing list belongs to a different project
    list_projects:
      gcc: gcc
      gcc-cvs: gcc
      binutils: binutils
      binutils-cvs: binutils
