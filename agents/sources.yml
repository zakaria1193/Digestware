# Repos the pipeline READS but does not ingest. The lesson agent navigates
# these to ground its explanations in the real source tree, instead of
# fetching sourceware pages one at a time.
#
# Both are direct git mirrors of the sourceware repositories, so a commit SHA
# seen on gcc-cvs / binutils-cvs resolves here verbatim. They are cloned bare
# and blobless (see agents/tools/source_repo.py), which is what keeps GCC in
# the hundreds of MB rather than gigabytes.
source_repos:
  gcc:
    url: https://github.com/gcc-mirror/gcc.git
    branch: master
  binutils:
    url: https://github.com/bminor/binutils-gdb.git
    branch: master

sources:
  - type: github
    project: gcc
    owner: gcc-mirror
    repo: gcc

  - type: public_inbox
    discussion_lists: [gcc, binutils]
    cvs_lists: [gcc-cvs, binutils-cvs]
    use_nntp: true
    # Per-list project override — each mailing list belongs to a different project
    list_projects:
      gcc: gcc
      gcc-cvs: gcc
      binutils: binutils
      binutils-cvs: binutils
