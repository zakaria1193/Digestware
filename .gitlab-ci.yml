image: node:22-slim

stages:
  - build

pages:
  stage: build
  variables:
    BASE_URL: "/$CI_PROJECT_NAME"
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci
    - npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
